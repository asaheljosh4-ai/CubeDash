name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Assemble SDL2 Android project
        run: |
          unzip -q CubeDash.zip
          git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git /tmp/SDL
          cp -r /tmp/SDL/android-project /tmp/ap
          mkdir -p /tmp/ap/app/jni/cd
          cp -r /tmp/SDL /tmp/ap/app/jni/SDL
          cp -r CubeDash/CMakeLists.txt CubeDash/src CubeDash/tests CubeDash/levels /tmp/ap/app/jni/cd/
          cp CubeDash/android/CMakeLists.txt /tmp/ap/app/jni/CMakeLists.txt
          echo 'if(ANDROID)' >> /tmp/ap/app/jni/cd/CMakeLists.txt
          echo '  target_compile_definitions(main PRIVATE IMGUI_IMPL_OPENGL_ES3)' >> /tmp/ap/app/jni/cd/CMakeLists.txt
          echo 'endif()' >> /tmp/ap/app/jni/cd/CMakeLists.txt
          rm -rf /tmp/ap/app/jni/src
          cat > /tmp/ap/app/build.gradle <<'GRADLE'
          apply plugin: 'com.android.application'
          android {
              namespace "org.libsdl.app"
              compileSdkVersion 34
              defaultConfig {
                  minSdkVersion 21
                  targetSdkVersion 34
                  versionCode 1
                  versionName "1.0"
                  externalNativeBuild {
                      cmake {
                          arguments "-DANDROID_STL=c++_static"
                          abiFilters 'arm64-v8a'
                      }
                  }
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              externalNativeBuild {
                  cmake { path 'jni/CMakeLists.txt' }
              }
              lint { abortOnError false }
          }
          dependencies {
              implementation fileTree(include: ['*.jar'], dir: 'libs')
          }
          GRADLE
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <application#' /tmp/ap/app/src/main/AndroidManifest.xml
      - name: Build
        working-directory: /tmp/ap
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CubeDash-apk
          path: /tmp/ap/app/build/outputs/apk/debug/*.apk
